services:

  db:
    image: postgres:15
    container_name: postgres_db

    environment:
      POSTGRES_DB: operational_loss_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: spring_backend

    ports:
      - "8081:8081"

    env_file:
      - ./backend/.env

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/operational_loss_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      db:
        condition: service_healthy

    restart: always

  frontend:
    build: ./frontend
    container_name: react_frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    restart: always

volumes:
  postgres_data: